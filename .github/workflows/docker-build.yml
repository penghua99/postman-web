name: Build & Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ph99

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          echo "tags=${{ env.IMAGE_PREFIX }}/postman-server:latest" > /tmp/server_tags.txt
          echo "tags=${{ env.IMAGE_PREFIX }}/postman-client:latest" > /tmp/client_tags.txt
          # 如果是从版本 tag 触发（如 v1.0.0），追加版本标签
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            echo "  ${{ env.IMAGE_PREFIX }}/postman-server:${VERSION}" >> /tmp/server_tags.txt
            echo "  ${{ env.IMAGE_PREFIX }}/postman-client:${VERSION}" >> /tmp/client_tags.txt
          fi
          echo "server_tags=$(cat /tmp/server_tags.txt | tr '\n' ',')" >> $GITHUB_OUTPUT
          echo "client_tags=$(cat /tmp/client_tags.txt | tr '\n' ',')" >> $GITHUB_OUTPUT

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.server_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.client
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.client_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
