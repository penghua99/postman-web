name: Build & Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ph99

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          TAGS_SERVER="${{ env.IMAGE_PREFIX }}/postman-server:latest"
          TAGS_CLIENT="${{ env.IMAGE_PREFIX }}/postman-client:latest"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS_SERVER="${TAGS_SERVER},${{ env.IMAGE_PREFIX }}/postman-server:${GITHUB_REF_NAME}"
            TAGS_CLIENT="${TAGS_CLIENT},${{ env.IMAGE_PREFIX }}/postman-client:${GITHUB_REF_NAME}"
          fi
          echo "server_tags=${TAGS_SERVER}" >> $GITHUB_OUTPUT
          echo "client_tags=${TAGS_CLIENT}" >> $GITHUB_OUTPUT

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.server_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.client
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.client_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
